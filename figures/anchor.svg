<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 882" role="img"><title>边界状态复用：精确前缀匹配，而非语义相似度检索</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#659277"/></marker></defs><rect width="1000" height="882" fill="#faf9f2"/><g font-family="Microsoft YaHei,Noto Sans SC,system-ui,sans-serif"><text x="38" y="47" font-size="25" fill="#2b4437" font-weight="700"><tspan x="38" dy="0">边界状态复用：精确前缀匹配，而非语义相似度检索</tspan></text><text x="40" y="88" font-size="16" fill="#6c7867" font-weight="400"><tspan x="40" dy="0">左列：处理；右列：本步交出的数据与状态。箭头沿同一条主线向下。</tspan></text><rect x="38" y="115" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="115" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="148" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">01  旧请求 tokens 长度 10</tspan></text><text x="57" y="193" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">已有 checkpoint 位于长度 4、6、10</tspan></text><text x="590" y="150" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="188" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">每个快照只对对应的精确前缀成立</tspan></text><path d="M535 187H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 260V282H280V302" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="305" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="305" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="338" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">02  新请求前 7 个 token 相同</tspan></text><text x="57" y="383" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">位置 7 之后被工具结果改写</tspan></text><text x="590" y="340" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="378" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">长为 10 的旧快照已不可用</tspan></text><path d="M535 377H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 450V472H280V492" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="495" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="495" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="528" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">03  选可恢复的最近边界：长度 6</tspan></text><text x="57" y="573" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">把快照复制到活跃请求状态槽</tspan></text><text x="590" y="530" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="568" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">树节点快照不允许被新请求原地污染</tspan></text><path d="M535 567H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 640V662H280V682" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="685" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="685" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="718" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">04  从位置 6 重算新后缀</tspan></text><text x="57" y="763" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">新请求长度 9 → 需处理 3 个 token</tspan></text><text x="590" y="720" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="758" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">KV 可匹配长度与递归状态可恢复长度不</tspan><tspan x="590" dy="27.900000000000002">同</tspan></text><path d="M535 757H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/></g></svg>