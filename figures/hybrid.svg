<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1072" role="img"><title>混合执行：每条 route 恰好被一个分支计算</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#659277"/></marker></defs><rect width="1000" height="1072" fill="#faf9f2"/><g font-family="Microsoft YaHei,Noto Sans SC,system-ui,sans-serif"><text x="38" y="47" font-size="25" fill="#2b4437" font-weight="700"><tspan x="38" dy="0">混合执行：每条 route 恰好被一个分支计算</tspan></text><text x="40" y="88" font-size="16" fill="#6c7867" font-weight="400"><tspan x="40" dy="0">左列：处理；右列：本步交出的数据与状态。箭头沿同一条主线向下。</tspan></text><rect x="38" y="115" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="115" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="148" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">01  一次路由先分 H / M</tspan></text><text x="57" y="193" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">H：命中；M：唯一缺失专家集合</tspan></text><text x="590" y="150" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="188" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">同一专家被多个 token 选中只计一次 mi</tspan><tspan x="590" dy="27.900000000000002">ss</tspan></text><path d="M535 187H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 260V282H280V302" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="305" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="305" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="338" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">02  从 M 选择 F，剩余交给 C</tspan></text><text x="57" y="383" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">F：搬到 GPU；C=M−F：CPU 计算</tspan></text><text x="590" y="340" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="378" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">GPU 集合 H∪F；CPU 集合 C；两者不重</tspan><tspan x="590" dy="27.900000000000002">叠</tspan></text><path d="M535 377H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 450V472H280V492" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="495" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="495" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="528" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">03  先提交 CPU，再发起 GPU 工作</tspan></text><text x="57" y="573" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">CPU：D2H 小输入 → host bank GEMV</tspan></text><text x="590" y="530" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="568" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">GPU：copy_missing → expert GEMM</tspan></text><path d="M535 567H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 640V662H280V682" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="685" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="685" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="718" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">04  同步并合并部分和</tspan></text><text x="57" y="763" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">gpu_w 对 CPU route 为 0</tspan></text><text x="590" y="720" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="758" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">cpu_ids 对 GPU route 为 −1；Y=Ygpu+</tspan><tspan x="590" dy="27.900000000000002">Ycpu</tspan></text><path d="M535 757H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 830V852H280V872" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="875" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="875" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="908" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">05  q 的选择由有效带宽决定</tspan></text><text x="57" y="953" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">先平衡时间，再取整数与容量上限</tspan></text><text x="590" y="910" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="948" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">当前源码可从并发 profile 得到 fetch </tspan><tspan x="590" dy="27.900000000000002">fraction</tspan></text><path d="M535 947H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/></g></svg>