<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 882" role="img"><title>显存预算：同一张卡上的多个池要共同结账</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#659277"/></marker></defs><rect width="1000" height="882" fill="#faf9f2"/><g font-family="Microsoft YaHei,Noto Sans SC,system-ui,sans-serif"><text x="38" y="47" font-size="25" fill="#2b4437" font-weight="700"><tspan x="38" dy="0">显存预算：同一张卡上的多个池要共同结账</tspan></text><text x="40" y="88" font-size="16" fill="#6c7867" font-weight="400"><tspan x="40" dy="0">左列：处理；右列：本步交出的数据与状态。箭头沿同一条主线向下。</tspan></text><rect x="38" y="115" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="115" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="148" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">01  总显存 / 空闲显存不是同一量</tspan></text><text x="57" y="193" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">启动时空闲量 + memory ratio + 已分配量</tspan></text><text x="590" y="150" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="188" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">同时观察其他进程与运行时分配</tspan></text><path d="M535 187H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 260V282H280V302" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="305" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="305" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="338" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">02  预留：主干、工作区、图、余量</tspan></text><text x="57" y="383" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">非专家权重与中间张量也要占空间</tspan></text><text x="590" y="340" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="378" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">专家量化小不代表整模型按同一比例缩小</tspan></text><path d="M535 377H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 450V472H280V492" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="495" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="495" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="528" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">03  为 KV / 状态池和专家池分配</tspan></text><text x="57" y="573" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">长度 / batch 改变所需缓存资源</tspan></text><text x="590" y="530" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="568" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">专家池更大可能挤压请求状态容量</tspan></text><path d="M535 567H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 640V662H280V682" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="685" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="685" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="718" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">04  运行时修改只能在安全点</tspan></text><text x="57" y="763" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">Scheduler 等无在途 batch、无待执行请求</tspan></text><text x="590" y="720" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="758" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">校验 → 重建池与图 → 恢复接收</tspan></text><path d="M535 757H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/></g></svg>