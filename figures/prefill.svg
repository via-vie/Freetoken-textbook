<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img"><title>Prefill 双缓冲：必须等读完，才能覆盖同一缓冲</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#659277"/></marker></defs><rect width="1000" height="610" fill="#faf9f2"/><g font-family="Microsoft YaHei,Noto Sans SC,system-ui,sans-serif"><text x="38" y="47" font-size="25" fill="#2b4437" font-weight="700"><tspan x="38" dy="0">Prefill 双缓冲：必须等读完，才能覆盖同一缓冲</tspan></text><text x="40" y="90" font-size="18" fill="#2b4437" font-weight="400"><tspan x="40" dy="0">假设每层搬运 2 ms、计算 3 ms，共 4 层；只是时间模型。</tspan></text><path d="M180 130V465" stroke="#e1e4d9"/><text x="176" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="176" dy="0">0</tspan></text><path d="M229 130V465" stroke="#e1e4d9"/><text x="225" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="225" dy="0">1</tspan></text><path d="M278 130V465" stroke="#e1e4d9"/><text x="274" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="274" dy="0">2</tspan></text><path d="M327 130V465" stroke="#e1e4d9"/><text x="323" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="323" dy="0">3</tspan></text><path d="M376 130V465" stroke="#e1e4d9"/><text x="372" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="372" dy="0">4</tspan></text><path d="M425 130V465" stroke="#e1e4d9"/><text x="421" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="421" dy="0">5</tspan></text><path d="M474 130V465" stroke="#e1e4d9"/><text x="470" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="470" dy="0">6</tspan></text><path d="M523 130V465" stroke="#e1e4d9"/><text x="519" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="519" dy="0">7</tspan></text><path d="M572 130V465" stroke="#e1e4d9"/><text x="568" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="568" dy="0">8</tspan></text><path d="M621 130V465" stroke="#e1e4d9"/><text x="617" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="617" dy="0">9</tspan></text><path d="M670 130V465" stroke="#e1e4d9"/><text x="666" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="666" dy="0">10</tspan></text><path d="M719 130V465" stroke="#e1e4d9"/><text x="715" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="715" dy="0">11</tspan></text><path d="M768 130V465" stroke="#e1e4d9"/><text x="764" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="764" dy="0">12</tspan></text><path d="M817 130V465" stroke="#e1e4d9"/><text x="813" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="813" dy="0">13</tspan></text><path d="M866 130V465" stroke="#e1e4d9"/><text x="862" y="496" font-size="14" fill="#2b4437" font-weight="400"><tspan x="862" dy="0">14</tspan></text><text x="28" y="200" font-size="18" fill="#2b4437" font-weight="700"><tspan x="28" dy="0">H2D 拷贝流</tspan></text><text x="28" y="310" font-size="18" fill="#2b4437" font-weight="700"><tspan x="28" dy="0">GPU 计算流</tspan></text><rect x="180" y="160" width="95" height="68" rx="5" fill="#b8d0ad" stroke="#a8b69f"/><text x="189" y="188" font-size="16" fill="#2b4437" font-weight="400"><tspan x="189" dy="0">L0 / B0</tspan></text><rect x="278" y="270" width="144" height="68" rx="5" fill="#b8d0ad" stroke="#a8b69f"/><text x="287" y="298" font-size="16" fill="#2b4437" font-weight="400"><tspan x="287" dy="0">L0 / B0</tspan></text><path d="M268 230V260H286" stroke="#659277" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="278" y="160" width="95" height="68" rx="5" fill="#edd39c" stroke="#a8b69f"/><text x="287" y="188" font-size="16" fill="#2b4437" font-weight="400"><tspan x="287" dy="0">L1 / B1</tspan></text><rect x="425" y="270" width="144" height="68" rx="5" fill="#edd39c" stroke="#a8b69f"/><text x="434" y="298" font-size="16" fill="#2b4437" font-weight="400"><tspan x="434" dy=