<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 882" role="img"><title>统一请求：生成 id 与算出该位置的 KV 是两件事</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#659277"/></marker></defs><rect width="1000" height="882" fill="#faf9f2"/><g font-family="Microsoft YaHei,Noto Sans SC,system-ui,sans-serif"><text x="38" y="47" font-size="25" fill="#2b4437" font-weight="700"><tspan x="38" dy="0">统一请求：生成 id 与算出该位置的 KV 是两件事</tspan></text><text x="40" y="88" font-size="16" fill="#6c7867" font-weight="400"><tspan x="40" dy="0">左列：处理；右列：本步交出的数据与状态。箭头沿同一条主线向下。</tspan></text><rect x="38" y="115" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="115" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="148" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">01  教学 prompt：小猫 / 喜欢 / 吃</tspan></text><text x="57" y="193" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">自定义 ids=[11,10,7]；位置 0,1,2</tspan></text><text x="590" y="150" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="188" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">已知 3；已计算 0</tspan></text><path d="M535 187H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 260V282H280V302" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="305" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="305" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="338" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">02  Prefill 计算位置 0..2</tspan></text><text x="57" y="383" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">最后一个 hidden → logits → 选择 8 鱼</tspan></text><text x="590" y="340" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="378" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">已知 4；已计算 3；8 尚未有 KV</tspan></text><path d="M535 377H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 450V472H280V492" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="495" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="495" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="528" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">03  Decode 只输入 id 8，位置 3</tspan></text><text x="57" y="573" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">Q 查历史 KV；写新 KV；选择 1 EOS</tspan></text><text x="590" y="530" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="568" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">已知 5；已计算 4；EOS 无需再前向</tspan></text><path d="M535 567H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 640V662H280V682" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="685" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="685" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="718" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">04  提交终止结果，回收活动资源</tspan></text><text x="57" y="763" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">不把停止 token 当作下一轮输入</tspan></text><text x="590" y="720" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="758" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">文本输出与缓存生命周期分开管理</tspan></text><path d="M535 757H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/></g></svg>