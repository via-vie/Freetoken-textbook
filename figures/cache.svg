<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1072" role="img"><title>专家缓存：逻辑身份与物理位置必须分开</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#659277"/></marker></defs><rect width="1000" height="1072" fill="#faf9f2"/><g font-family="Microsoft YaHei,Noto Sans SC,system-ui,sans-serif"><text x="38" y="47" font-size="25" fill="#2b4437" font-weight="700"><tspan x="38" dy="0">专家缓存：逻辑身份与物理位置必须分开</tspan></text><text x="40" y="88" font-size="16" fill="#6c7867" font-weight="400"><tspan x="40" dy="0">左列：处理；右列：本步交出的数据与状态。箭头沿同一条主线向下。</tspan></text><rect x="38" y="115" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="115" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="148" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">01  router ids：本层 [1,3]</tspan></text><text x="57" y="193" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">完整身份：(layer,e)，例如 (2,3)</tspan></text><text x="590" y="150" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="188" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">扁平 key = layer×E+expert</tspan></text><path d="M535 187H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 260V282H280V302" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="305" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="305" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="338" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">02  查 slot_for_id / id_of_slot</tspan></text><text x="57" y="383" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">命中保留；缺失去重；选择可替换槽</tspan></text><text x="590" y="340" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="378" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">不能驱逐本步仍要使用的命中专家</tspan></text><path d="M535 377H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 450V472H280V492" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="495" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="495" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="528" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">03  准备 src_indices / evict_slots</tspan></text><text x="57" y="573" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">源是 host 当前层 expert 行</tspan></text><text x="590" y="530" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="568" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">目标是对应 pool 的 GPU slot 行</tspan></text><path d="M535 567H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 640V662H280V682" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="685" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="685" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="718" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">04  copy_missing 后再 GEMM</tspan></text><text x="57" y="763" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">bank 列表共用同一组 src/dst 索引</tspan></text><text x="590" y="720" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="758" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">topk_ids 原地改写：expert id → slot</tspan><tspan x="590" dy="27.900000000000002"> id</tspan></text><path d="M535 757H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 830V852H280V872" fill="none" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="875" width="495" height="145" rx="8" fill="#eaf0e1" stroke="#c5d2bb"/><rect x="570" y="875" width="390" height="145" rx="8" fill="#fffefa" stroke="#c5d2bb"/><text x="56" y="908" font-size="20" fill="#2b4437" font-weight="700"><tspan x="56" dy="0">05  当前版本支持多个 pool</tspan></text><text x="57" y="953" font-size="18" fill="#2b4437" font-weight="400"><tspan x="57" dy="0">unified 按兼容 layout 分组</tspan></text><text x="590" y="910" font-size="14" fill="#76816a" font-weight="400"><tspan x="590" dy="0">交接账本</tspan></text><text x="590" y="948" font-size="18" fill="#2b4437" font-weight="400"><tspan x="590" dy="0">per-layer 则逐层分组；不是任意布局互</tspan><tspan x="590" dy="27.900000000000002">换</tspan></text><path d="M535 947H567" stroke="#659277" stroke-width="2" marker-end="url(#arrow)"/></g></svg>